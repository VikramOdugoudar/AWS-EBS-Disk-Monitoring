[defaults]
inventory            = ./inventory
roles_path           = ./roles
host_key_checking    = False
gathering             = smart
fact_caching          = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout  = 3600
stdout_callback       = yaml
bin_ansible_callbacks = True
retry_files_enabled   = False
interpreter_python    = /usr/bin/python3

# Parallelism. Note this interacts with site.yml's `serial`: forks bounds
# concurrency within a batch, serial bounds the batch size.
forks = 25

[inventory]
enable_plugins = amazon.aws.aws_ec2, constructed
cache          = True
cache_plugin   = jsonfile
cache_timeout  = 300

[ssh_connection]
# Unused — ansible_connection is aws_ssm fleet-wide. Kept only as a fail-fast bound.
timeout = 10
